services:
  - type: web
    name: ethen-portfolio-analytics-xuxudong31
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ethen-portfolio-analytics
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: ANALYTICS_VISITOR_SECRET
        generateValue: true
      - key: ANALYTICS_TIME_ZONE
        value: Asia/Shanghai
      - key: ANALYTICS_ALLOWED_ORIGINS
        value: https://xuxudong31.github.io

databases:
  - name: ethen-portfolio-analytics
    plan: free
    region: singapore
    databaseName: ethen_portfolio_analytics

